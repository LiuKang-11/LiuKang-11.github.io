<svg class="intro-capybara" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-label="A capybara turning the pages of a book" focusable="false">
  <g stroke="var(--intro-ink, #25251f)" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- A quiet, block-like body. The book is the foreground. -->
    <path d="M100 270V165c0-31 21-49 49-49h72c29 0 50 19 50 49v105Z" fill="var(--intro-sheet, #f5f0e6)"/>
    <path d="M100 187h48v83h-48Z" fill="var(--blue, #194d90)"/>
    <path d="M148 226h123v44H148Z" fill="var(--yellow, #f2c438)"/>

    <!-- Small ears, a low forehead and an elongated, square muzzle. -->
    <path d="M126 79V62c0-10 7-17 16-17s16 7 16 17v14Z" fill="var(--yellow, #f2c438)"/>
    <path d="M135 70V61c0-4 3-7 7-7s7 3 7 7v9Z" fill="var(--red, #cc3226)" stroke-width="3"/>
    <path d="M220 75V60c0-9 6-15 14-15s14 6 14 15v21Z" fill="var(--yellow, #f2c438)"/>
    <path d="M228 69v-9c0-3 2-6 6-6s6 3 6 6v9Z" fill="var(--intro-sheet, #f5f0e6)" stroke-width="3"/>
    <path d="M108 154v-40c0-29 18-46 47-46h58c25 0 41 11 48 32l5 15h22c17 0 27 10 27 26v22c0 18-11 28-29 28H151c-27 0-43-13-43-37Z" fill="var(--yellow, #f2c438)"/>
    <path d="M110 129h47v59c-30 0-47-12-47-34Z" fill="var(--intro-sheet, #f5f0e6)"/>
    <path d="M157 154h43v37h-43Z" fill="var(--blue, #194d90)"/>
    <path d="M239 122h48c12 0 19 7 19 19v20c0 13-8 20-21 20h-46Z" fill="var(--intro-sheet, #f5f0e6)"/>
    <g class="intro-capybara__eyes" fill="var(--intro-ink, #25251f)" stroke="none">
      <rect x="169" y="108" width="6" height="8" rx="2.5"/>
      <rect x="234" y="108" width="6" height="8" rx="2.5"/>
    </g>
    <path d="M285 139v5m-25 19h16" fill="none" stroke-width="3.5"/>
    <path d="M186 83h22" fill="none" stroke-width="3"/>

    <!-- Both covers and the resting paper remain when the leaf turns. -->
    <path d="M180 232 53 213v71l127 24Z" fill="var(--red, #cc3226)"/>
    <path d="m180 232 127-19v71l-127 24Z" fill="var(--blue, #194d90)"/>
    <path d="M180 227 64 208v68l116 23Z" fill="var(--intro-sheet, #f5f0e6)"/>
    <path d="m180 227 116-19v68l-116 23Z" fill="var(--intro-sheet, #f5f0e6)"/>
    <path d="M180 227v72" fill="none"/>
    <path d="m80 229 36 6v16l-36-6Z" fill="var(--yellow, #f2c438)" stroke-width="3"/>
    <path d="m126 237 35 6m-81 14 81 16m-81-6 51 10" fill="none" stroke-width="2.5"/>
    <path d="m200 243 29-5v25l-29 6Z" fill="var(--blue, #194d90)" stroke-width="3"/>
    <path d="m242 235 37-6m-37 17 37-7m-79 40 79-16" fill="none" stroke-width="2.5"/>

    <!-- Each leaf pivots about the shared spine at x=180, y=263. -->
    <g class="intro-capybara__page intro-capybara__page--second">
      <path d="m180 227 116-19v68l-116 23Z" fill="var(--intro-sheet, #f5f0e6)" stroke-width="3"/>
      <path d="m200 244 29-5v25l-29 6Z" fill="var(--red, #cc3226)" stroke-width="2.5"/>
      <path d="m242 236 36-6m-36 17 36-7m-78 40 78-16" fill="none" stroke-width="2.5"/>
    </g>
    <g class="intro-capybara__page intro-capybara__page--first">
      <path d="m180 227 116-19v68l-116 23Z" fill="var(--intro-sheet, #f5f0e6)" stroke-width="3"/>
      <path d="m200 244 36-6v16l-36 7Z" fill="var(--yellow, #f2c438)" stroke-width="2.5"/>
      <path d="m248 235 30-5m-30 17 30-6m-78 39 78-16" fill="none" stroke-width="2.5"/>
    </g>

    <!-- Paws stay above the page edges, so turning paper reads as held. -->
    <g class="intro-capybara__paw intro-capybara__paw--left">
      <path d="M56 232h9c10 0 16 6 16 15v12c0 8-5 13-13 13H56c-8 0-13-5-13-13v-14c0-8 5-13 13-13Z" fill="var(--yellow, #f2c438)"/>
      <path d="M61 247h14m-14 10h14" fill="none" stroke-width="2.5"/>
    </g>
    <g class="intro-capybara__paw intro-capybara__paw--right">
      <path d="M294 232h10c8 0 13 5 13 13v14c0 8-5 13-13 13h-11c-8 0-13-5-13-13v-12c0-9 5-15 14-15Z" fill="var(--yellow, #f2c438)"/>
      <path d="M286 247h14m-14 10h14" fill="none" stroke-width="2.5"/>
    </g>
  </g>
</svg>
